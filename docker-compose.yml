services:
    db:
        image: postgres:17
        ports:
            - '${DB_PORT:-5432}:5432'
        environment:
            - POSTGRES_USER=${DB_USERNAME:-postgres}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
            - POSTGRES_DB=staffing
        volumes:
            - pgdata:/var/lib/postgresql/data
volumes:
    pgdata:
