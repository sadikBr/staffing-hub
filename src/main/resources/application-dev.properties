# Local development: run with --spring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev).
# NEVER enable this profile in production: it turns security off and loads demo data.

# No login needed.
staffing.security.enabled=false

# The Vite dev server of the frontend.
staffing.security.allowed-origins=http://localhost:5173

# Load demo data (employees, skills, customers, missions...) on top of the schema migrations.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-data
