# A much larger demo dataset (about 70 employees, 25 customers, 40 missions), to see how the application behaves
# with real-world volumes. Use together with the 'dev' profile, on a fresh database:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,large-demo
# NEVER enable this profile in production.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-data,classpath:db/large-demo
