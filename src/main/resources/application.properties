spring.application.name=staffing-hub
server.port=8000

spring.datasource.url=jdbc:postgresql://localhost:5432/staffing
spring.datasource.username=postgres
spring.datasource.password=password

# If you want to create the database tables from the models definitions, use the below property
# spring.jpa.hibernate.ddl-auto=create

# Show SQL queries to the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
