spring.application.name=staffing-hub
server.port=8000

# Database connection: override with environment variables outside local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/staffing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate

# Every lazy association is loaded inside a service transaction, never while rendering the HTTP response.
spring.jpa.open-in-view=false

# Load lazy associations of many entities in a single query (avoids N+1 queries when mapping lists). Matches the
# maximum page size below, so a page always loads each association in one query (see QueryCountTests).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Pagination limits for list endpoints that support it.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Uncomment to log the SQL that Hibernate executes (and the bound parameters).
# logging.level.org.hibernate.SQL=debug
# logging.level.org.hibernate.orm.jdbc.bind=trace

# Swagger UI: http://localhost:8000/swagger-ui.html (OpenAPI spec: /v3/api-docs)
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# Security: every endpoint needs an access token from the company's OpenID Connect login provider.
# OIDC_ISSUER_URI examples: Microsoft Entra ID https://login.microsoftonline.com/<tenant-id>/v2.0,
# Google https://accounts.google.com, Keycloak https://<host>/realms/<realm>.
staffing.security.issuer-uri=${OIDC_ISSUER_URI:}
# Optional: only accept tokens issued for this audience (usually the API's client/application id).
staffing.security.audience=${OIDC_AUDIENCE:}
# The frontend logs users in itself (authorization code flow with PKCE), with this client registered at the provider.
staffing.security.client-id=${OIDC_CLIENT_ID:}
# Scopes the frontend requests. With Entra ID, add the API scope, e.g. "openid profile email api://<api-client-id>/access".
staffing.security.scope=${OIDC_SCOPE:openid profile email}
# Browser origins allowed to call the API from another domain, comma-separated (e.g. https://staffing.example.com).
staffing.security.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Health check for load balancers / container platforms: /actuator/health (plus /liveness and /readiness).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
