name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Build Docker image
        run: docker build -t staffing-hub .
